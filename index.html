<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hemma">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Hemma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}

/* Layout: one-column app. Tappable tiles open bottom sheets; floating pill nav; details live in sheets, not on the page */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --sunk:#eef1f0; --line:#e4e8e6; --ink:#121816; --muted:#727c78;
  --accent:#119c72; --accent-soft:#e1f4ec; --on-accent:#ffffff;
  --a:#4a6cf7; --a-soft:#e8edfe; --k:#ec8424; --k-soft:#fdf0e3; --danger:#d1432f;
  --shadow:0 1px 2px rgba(18,24,22,.04),0 10px 30px -12px rgba(18,24,22,.12);
  --scrim:rgba(12,18,16,.32);
  --font:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1110; --surface:#171d1b; --sunk:#202725; --line:#27302d; --ink:#eef3f1; --muted:#8c9893;
  --accent:#3fd0a0; --accent-soft:#16302a; --on-accent:#0b1512;
  --a:#8ea5ff; --a-soft:#1e2645; --k:#f6a560; --k-soft:#382716; --danger:#ff8b78;
  --shadow:0 1px 0 rgba(255,255,255,.03); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1110; --surface:#171d1b; --sunk:#202725; --line:#27302d; --ink:#eef3f1; --muted:#8c9893;
  --accent:#3fd0a0; --accent-soft:#16302a; --on-accent:#0b1512;
  --a:#8ea5ff; --a-soft:#1e2645; --k:#f6a560; --k-soft:#382716; --danger:#ff8b78;
  --shadow:0 1px 0 rgba(255,255,255,.03); --scrim:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px;display:flex;flex-direction:column;gap:16px}
.tap{transition:transform .12s ease,background .15s,border-color .15s,color .15s}
.tap:active{transform:scale(.97)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.avatar.A{background:var(--a-soft);color:var(--a)} .avatar.K{background:var(--k-soft);color:var(--k)}
.avatar.B{background:var(--accent-soft);color:var(--accent);font-size:12px}
.avatar.none{background:var(--sunk);color:var(--muted)}
.avatar.sm{width:32px;height:32px;font-size:13px} .avatar.sm.B{font-size:10px}
.status{padding:12px 14px;border-radius:16px;background:var(--surface);color:var(--muted);font-size:14px;box-shadow:var(--shadow)}

/* week */
.weekhead{display:flex;align-items:center;justify-content:space-between}
.weekhead b{font-size:15px;font-weight:700;color:var(--muted)}
.arrows{display:flex;gap:6px}
.arr{width:38px;height:38px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.arr svg{width:18px;height:18px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.d{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.d span{font-size:12px;font-weight:600;color:var(--muted)}
.d strong{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.d .dots{display:flex;gap:3px;height:5px}
.d .dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.d .dots i.on{background:var(--accent)}
.d.today strong{color:var(--accent)}
.d.sel{background:var(--ink)} .d.sel span{color:var(--bg);opacity:.7} .d.sel strong{color:var(--bg)}
.d.sel .dots i{background:var(--muted)} .d.sel .dots i.on{background:var(--accent)}
.dayttl{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 2px -4px}
.tiles{display:flex;flex-direction:column;gap:10px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border-radius:22px;padding:14px 14px 14px 14px;box-shadow:var(--shadow)}
.ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--muted)}
.ico svg{width:24px;height:24px}
.tile.filled .ico{background:var(--accent-soft);color:var(--accent)}
.tile .txt{flex:1;min-width:0}
.tile .txt small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.tile .txt b{display:block;font-size:18px;font-weight:700;overflow-wrap:anywhere}
.tile:not(.filled) .txt b{color:var(--muted);font-weight:600}
.plus{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-size:20px;font-weight:600;flex:none}
.soft{align-self:center;height:40px;padding:0 16px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.soft svg{width:16px;height:16px}

/* shop */
.add{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:20px;padding:6px 6px 6px 18px;box-shadow:var(--shadow)}
.add input{flex:1;min-width:0;border:0;background:none;font-size:17px;height:44px;outline:none}
.add input::placeholder{color:var(--muted)}
.round{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.round svg{width:22px;height:22px}
.count{display:flex;align-items:baseline;gap:8px;margin:2px 2px -6px}
.count b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.count span{color:var(--muted);font-size:14px;font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding-right:4px}
.item .main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:14px 4px 14px 14px;text-align:left}
.box{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.box svg{width:16px;height:16px}
.item .t{overflow-wrap:anywhere;font-weight:500}
.item.done{background:transparent;box-shadow:none;border:1px solid var(--line)}
.item.done .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.item.done .t{color:var(--muted);text-decoration:line-through}
.x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.x svg{width:18px;height:18px}
.fold{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 0 6px}
.fold button{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--muted);font-size:14px;height:36px}
.fold button svg{width:16px;height:16px;transition:transform .2s}
.fold button[aria-expanded="true"] svg{transform:rotate(180deg)}
.link{color:var(--accent)!important}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);padding:34px 16px;border-radius:22px;border:1.5px dashed var(--line);font-size:15px}
.empty svg{width:34px;height:34px;opacity:.6}

/* money */
.bal{background:var(--surface);border-radius:28px;padding:22px 20px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.bal .row{display:flex;align-items:center;gap:10px}
.bal .arrow{color:var(--muted)} .bal .arrow svg{width:22px;height:22px}
.bal .big{font-size:46px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:6px}
.bal .sub{color:var(--muted);font-weight:600;font-size:15px}
.bal.even .big{color:var(--accent)}
.btn{height:52px;padding:0 22px;border-radius:16px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--sunk)}
.btn.full{width:100%}
.bal .btn{margin-top:10px;height:44px;font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.stat div{min-width:0}
.stat small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.stat b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:18px;padding:12px 14px 12px 12px;box-shadow:var(--shadow)}
.hrow .mid{flex:1;min-width:0}
.hrow .mid b{display:block;font-weight:600;overflow-wrap:anywhere}
.hrow .mid small{color:var(--muted);font-size:13px}
.hrow .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.hrow .amt small{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.hrow .amt small.treat{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 244px),env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px 0 18px;border-radius:20px;background:var(--ink);color:var(--bg);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);z-index:6}
.fab svg{width:22px;height:22px}

/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 32px));display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;border-radius:24px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px -10px rgba(0,0,0,.25),0 0 0 1px var(--line);z-index:7}
nav button{height:52px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
nav button svg{width:22px;height:22px}
nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s;z-index:20}
.sheet{position:fixed;left:50%;bottom:0;width:min(520px,100%);transform:translate(-50%,105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:var(--surface);border-radius:28px 28px 0 0;z-index:21;max-height:88%;overflow-y:auto;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheetwrap.open .scrim{opacity:1}
.sheetwrap.open .sheet{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.sheet h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sheet .ttl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet .ttl small{display:block;color:var(--muted);font-size:14px;font-weight:600}
.close{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;flex:none}
.close svg{width:18px;height:18px}
.lbl{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:-8px}
.bigin{width:100%;height:58px;border-radius:18px;border:2px solid var(--line);background:var(--sunk);padding:0 16px;font-size:19px;font-weight:600;outline:none}
.bigin:focus{border-color:var(--accent);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips:empty{display:none}
.chipb{height:38px;padding:0 14px;border-radius:999px;background:var(--sunk);font-weight:600;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg{display:grid;gap:8px}
.seg.c2{grid-template-columns:1fr 1fr} .seg.c4{grid-template-columns:repeat(4,1fr)}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;background:var(--sunk);font-weight:700;font-size:14px;border:2px solid transparent}
.opt small{font-weight:500;font-size:12px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt.A[aria-pressed="true"]{border-color:var(--a);background:var(--a-soft);color:var(--a)}
.opt.K[aria-pressed="true"]{border-color:var(--k);background:var(--k-soft);color:var(--k)}
.amtview{text-align:center;font-size:52px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1;padding:4px 0}
.amtview span{color:var(--muted);font-size:26px;letter-spacing:0;margin-left:6px}
.amtview.zero{color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:56px;border-radius:16px;background:var(--sunk);font-size:22px;font-weight:700;display:grid;place-items:center}
.key svg{width:24px;height:24px}
.noteb{align-self:flex-start;color:var(--accent);font-weight:700;font-size:14px;height:32px}
.textin{width:100%;height:50px;border-radius:14px;border:2px solid var(--line);background:var(--sunk);padding:0 14px;font-size:16px;outline:none}
.textin:focus{border-color:var(--accent)}
.danger{color:var(--danger)!important}
.flow{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 0}
.flow .avatar{width:64px;height:64px;font-size:22px}
.flow svg{width:28px;height:28px;color:var(--muted)}
.center{text-align:center;color:var(--muted);margin:0}
.kv{display:flex;flex-direction:column;gap:0;background:var(--sunk);border-radius:18px;padding:4px 16px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.kv div:first-child{border-top:0}
.kv span{color:var(--muted)} .kv b{text-align:right;overflow-wrap:anywhere;min-width:0}
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--sunk);border-radius:16px;font-weight:600;width:100%}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switchrow[aria-pressed="true"] .sw{background:var(--accent)}
.switchrow[aria-pressed="true"] .sw::after{transform:translateX(20px)}
.err{color:var(--danger);font-size:14px;font-weight:600;margin:-6px 0 0;text-align:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:15px;z-index:30;max-width:calc(100% - 32px);box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
.toast span{white-space:nowrap}
.toast button{background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:11px;padding:9px 13px}
.pop{animation:pop .25s ease}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Hemma</h1><span class="pill" id="countdown"><i></i>Adrian & Kemal</span></div>
    <button class="avatar tap" id="meBtn" aria-label="Inställningar">A</button>
  </header>
  <div id="status" class="status">Laddar er data…</div>

  <section id="v-mat" class="wrap-inner" style="display:flex;flex-direction:column;gap:14px">
    <div class="weekhead">
      <b id="wTitle">Vecka</b>
      <div class="arrows">
        <button class="arr tap" id="prevW" aria-label="Förra veckan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="arr tap" id="nextW" aria-label="Nästa vecka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="strip" id="strip"></div>
    <div class="dayttl" id="dayTtl">Idag</div>
    <div class="tiles" id="tiles"></div>
    <button class="soft tap" id="copyW"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="3"/><path d="M5 15V6a3 3 0 0 1 3-3h9"/></svg>Kopiera förra veckan</button>
  </section>

  <section id="v-handla" hidden style="display:flex;flex-direction:column;gap:14px">
    <form class="add" id="shopForm">
      <input id="shopIn" placeholder="Lägg till vara…" autocomplete="off" aria-label="Ny vara" enterkeyhint="done">
      <button class="round tap" type="submit" aria-label="Lägg till"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
    <div class="count" id="shopCount"></div>
    <div class="list" id="shopTodo"></div>
    <div class="fold" id="doneHead" hidden>
      <button id="toggleDone" aria-expanded="false"><span id="doneLbl">I korgen</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="link" id="clearDone">Rensa</button>
    </div>
    <div class="list" id="shopDone" hidden></div>
  </section>

  <section id="v-pengar" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="bal" id="bal"></div>
    <div class="stats" id="stats"></div>
    <div class="fold"><button id="toggleHist" aria-expanded="false"><span id="histLbl">Senaste köpen</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button></div>
    <div class="list" id="hist"></div>
  </section>
</div>

<button class="fab tap" id="fab" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nytt köp</button>

<nav role="tablist" aria-label="Flikar">
  <button role="tab" data-tab="mat" aria-selected="true" class="tap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="4"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/></svg>Veckan</button>
  <button role="tab" data-tab="handla" aria-selected="false" class="tap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Handla</button>
  <button role="tab" data-tab="pengar" aria-selected="false" class="tap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="4"/><circle cx="12" cy="12.5" r="2.5"/></svg>Pengar</button>
</nav>

<div class="sheetwrap" id="sheetWrap" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"><div class="grab"></div><div id="sheetBody" style="display:flex;flex-direction:column;gap:16px"></div></div>
</div>
<div class="toast" id="toast" hidden><span id="toastTxt"></span><button id="toastBtn">Ångra</button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const NAME={A:"Adrian",K:"Kemal"}, OTHER={A:"K",K:"A"};
const DAYS=["Mån","Tis","Ons","Tor","Fre","Lör","Sön"], DAYS_L=["Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag","Söndag"];
const MONTHS=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};

const I={
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H9l-6 6 6 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z"/><path d="M15 10l-4 4M11 10l4 4"/></svg>',
  f:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17M8 3v3M12 3v3"/></svg>',
  l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M8 8c0-2 2-2 2-4M13 8c0-2 2-2 2-4"/></svg>',
  m:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"/><circle cx="12" cy="13" r="3.5"/><path d="M12 3v2"/></svg>',
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="4"/><circle cx="12" cy="12.5" r="2.5"/></svg>'
};

let db=null, meals={}, shop=[], money=[];
let me=ls.get("hemma.me","A"), shown=ls.get("hemma.slots","flm"), tab="mat";
let weekOffset=0, selIdx=(new Date().getDay()+6)%7, showDone=false, showAllHist=false;

// ---------- helpers ----------
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function monday(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return d}
function weekNo(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
const kr=n=>(Math.round(n*100)/100).toLocaleString("sv-SE",{maximumFractionDigits:2})+" kr";
const SLOTS=[{k:"f",n:"Frukost",ph:"T.ex. gröt"},{k:"l",n:"Lunch",ph:"T.ex. matlåda"},{k:"m",n:"Middag",ph:"T.ex. tacos"}];
const mealKey=(date,slot)=>slot==="m"?date:`${date}_${slot}`; // middag keeps plain date id
const COOK={"":"Ingen",A:"Adrian",K:"Kemal",B:"Båda"};
const av=(c,sm)=>`<span class="avatar ${sm?"sm ":""}${c||"none"}">${c==="B"?"A+K":c||"?"}</span>`;

function countdown(){
  const now=new Date();if(now.getMonth()===0)return;
  const days=Math.ceil((new Date(now.getFullYear()+1,0,1)-now)/864e5);
  $("countdown").innerHTML=`<i></i>${days} dagar till januari`;
}

// ---------- sheet ----------
let onClose=null;
function openSheet(html,mount){
  $("sheetBody").innerHTML=html;$("sheetWrap").hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>$("sheetWrap").classList.add("open")));
  $("sheetBody").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  mount&&mount($("sheetBody"));
}
function closeSheet(){$("sheetWrap").classList.remove("open");setTimeout(()=>{if(!$("sheetWrap").classList.contains("open"))$("sheetWrap").hidden=true},280);document.activeElement?.blur?.()}
$("scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheetWrap").hidden)closeSheet()});
const head=(t,s)=>`<div class="ttl"><div>${s?`<small>${s}</small>`:""}<h3>${t}</h3></div><button class="close tap" data-close aria-label="Stäng">${I.close}</button></div>`;

// ---------- toast ----------
let toastTimer;
function toast(msg,undo){
  $("toastTxt").textContent=msg;$("toastBtn").hidden=!undo;
  $("toastBtn").onclick=()=>{undo&&undo();$("toast").hidden=true};
  $("toast").hidden=false;$("toast").classList.remove("pop");void $("toast").offsetWidth;$("toast").classList.add("pop");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").hidden=true,5000);
}
function fail(e){toast("Kunde inte spara. Kolla nätet.");console.error(e)}

// ---------- tabs ----------
function showTab(t){
  tab=t;$("toast").hidden=true;document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  ["mat","handla","pengar"].forEach(v=>$("v-"+v).hidden=v!==t);
  $("fab").hidden=t!=="pengar";ls.set("hemma.tab",t);window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{buzz();showTab(b.dataset.tab)});

// ---------- settings ----------
function renderMe(){$("meBtn").className="avatar tap "+me;$("meBtn").textContent=me}
$("meBtn").onclick=()=>openSheet(head("Inställningar")+
  `<div class="lbl">Vem är du?</div><div class="seg c2">${["A","K"].map(p=>`<button class="opt tap ${p}" data-me="${p}" aria-pressed="${me===p}">${av(p)}${NAME[p]}</button>`).join("")}</div>
   <div class="lbl">Måltider i veckan</div><div style="display:flex;flex-direction:column;gap:8px">${SLOTS.map(s=>`<button class="switchrow tap" data-sl="${s.k}" aria-pressed="${shown.includes(s.k)}">${s.n}<span class="sw"></span></button>`).join("")}</div>
   <p class="center" style="font-size:13px">Sparas bara på den här telefonen.</p>`,
  el=>{
    el.querySelectorAll("[data-me]").forEach(b=>b.onclick=()=>{me=b.dataset.me;ls.set("hemma.me",me);renderMe();el.querySelectorAll("[data-me]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.me===me))});
    el.querySelectorAll("[data-sl]").forEach(b=>b.onclick=()=>{const s=b.dataset.sl;
      const next=shown.includes(s)?shown.replace(s,""):SLOTS.map(x=>x.k).filter(k=>shown.includes(k)||k===s).join("");
      if(!next){toast("Minst en måltid måste visas.");return}
      shown=next;ls.set("hemma.slots",shown);b.setAttribute("aria-pressed",shown.includes(s));renderWeek()});
  });

// ---------- week ----------
function selDate(){const d=monday(weekOffset);d.setDate(d.getDate()+selIdx);return d}
function renderWeek(){
  const m=monday(weekOffset), today=iso(new Date()), slots=SLOTS.filter(s=>shown.includes(s.k));
  $("wTitle").textContent=weekOffset===0?`Denna vecka · v.${weekNo(m)}`:weekOffset===1?`Nästa vecka · v.${weekNo(m)}`:weekOffset===-1?`Förra veckan · v.${weekNo(m)}`:`Vecka ${weekNo(m)}`;
  $("strip").innerHTML="";
  for(let i=0;i<7;i++){
    const d=new Date(m);d.setDate(m.getDate()+i);const date=iso(d);
    const b=document.createElement("button");
    b.className="d tap"+(date===today?" today":"")+(i===selIdx?" sel":"");
    b.setAttribute("aria-label",`${DAYS_L[i]} ${d.getDate()} ${MONTHS[d.getMonth()]}`);
    b.innerHTML=`<span>${DAYS[i]}</span><strong>${d.getDate()}</strong><div class="dots">${slots.map(s=>`<i class="${meals[mealKey(date,s.k)]?.dish?"on":""}"></i>`).join("")}</div>`;
    b.onclick=()=>{selIdx=i;buzz();renderWeek()};
    $("strip").appendChild(b);
  }
  const sd=selDate(), sdate=iso(sd);
  $("dayTtl").textContent=sdate===today?"Idag":`${DAYS_L[selIdx]} ${sd.getDate()} ${MONTHS[sd.getMonth()]}`;
  $("tiles").innerHTML="";
  slots.forEach(s=>{
    const meal=meals[mealKey(sdate,s.k)]||{}, has=!!meal.dish;
    const t=document.createElement("button");t.className="tile tap"+(has?" filled":"");
    t.innerHTML=`<span class="ico">${I[s.k]}</span><span class="txt"><small>${s.n}</small><b>${has?esc(meal.dish):"Lägg till"}</b></span>${has?(meal.cook?av(meal.cook,true):""):'<span class="plus">+</span>'}`;
    t.onclick=()=>openMeal(sdate,s,sd);
    $("tiles").appendChild(t);
  });
}
function dishSuggestions(){
  const c={};Object.values(meals).forEach(x=>{if(x.dish)c[x.dish]=(c[x.dish]||0)+1});
  return Object.keys(c).sort((a,b)=>c[b]-c[a]||a.localeCompare(b,"sv"));
}
function openMeal(date,s,d){
  const key=mealKey(date,s.k), meal=meals[key]||{};let cook=meal.cook||"";
  openSheet(head(s.n,`${DAYS_L[(d.getDay()+6)%7]} ${d.getDate()} ${MONTHS[d.getMonth()]}`)+
    `<input class="bigin" id="mIn" placeholder="${s.ph}" autocomplete="off" enterkeyhint="done">
     <div class="chips" id="sugg"></div>
     <div class="lbl">Vem lagar?</div>
     <div class="seg c4">${["A","K","B",""].map(c=>`<button class="opt tap ${c}" data-c="${c}" aria-pressed="${cook===c}">${av(c,true)}${COOK[c]}</button>`).join("")}</div>
     <button class="btn pri full tap" id="mSave">Spara</button>
     ${meal.dish?`<button class="btn full tap danger" id="mClear">Töm ${s.n.toLowerCase()}</button>`:""}`,
    el=>{
      const inp=el.querySelector("#mIn");inp.value=meal.dish||"";
      const all=dishSuggestions();
      const sugg=()=>{const q=inp.value.trim().toLowerCase();const list=all.filter(x=>x.toLowerCase()!==q&&x.toLowerCase().includes(q)).slice(0,8);
        el.querySelector("#sugg").replaceChildren(...list.map(x=>{const b=document.createElement("button");b.className="chipb tap";b.textContent=x;b.onclick=()=>{inp.value=x;sugg()};return b}))};
      sugg();inp.oninput=sugg;
      el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cook=b.dataset.c;buzz();el.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.c===cook))});
      const save=()=>{const v=inp.value.trim();setMeal(key,{dish:v,cook:v?cook:""});closeSheet()};
      el.querySelector("#mSave").onclick=save;inp.onkeydown=e=>{if(e.key==="Enter")inp.blur()};
      const clr=el.querySelector("#mClear");
      if(clr)clr.onclick=()=>{const old={...meal};setMeal(key,{dish:"",cook:""});closeSheet();toast(`${s.n} tömd`,()=>setMeal(key,old))};
      if(!meal.dish)setTimeout(()=>inp.focus(),300);
    });
}
function setMeal(key,val){
  if(val.dish)meals[key]=val;else delete meals[key];renderWeek();if(!db)return;
  const ref=db.doc("meals/"+key);(val.dish?ref.set(val):ref.delete()).catch(fail);
}
$("prevW").onclick=()=>{weekOffset--;renderWeek()};
$("nextW").onclick=()=>{weekOffset++;renderWeek()};
$("copyW").onclick=()=>{
  const m=monday(weekOffset);const done=[];
  for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);const p=new Date(d);p.setDate(d.getDate()-7);
    SLOTS.filter(s=>shown.includes(s.k)).forEach(s=>{const to=mealKey(iso(d),s.k),src=meals[mealKey(iso(p),s.k)];
      if(src?.dish&&!meals[to]?.dish){setMeal(to,{...src});done.push(to)}})}
  done.length?toast(`${done.length} måltider kopierade`,()=>done.forEach(k=>setMeal(k,{dish:"",cook:""}))):toast("Inget att kopiera hit.");
};

// ---------- shop ----------
function renderShop(){
  const todo=shop.filter(x=>!x.done).sort((a,b)=>a.t-b.t), done=shop.filter(x=>x.done).sort((a,b)=>b.t-a.t);
  $("shopCount").innerHTML=todo.length?`<b>${todo.length} ${todo.length===1?"sak":"saker"}</b><span>kvar att handla</span>`:"";
  const mk=x=>{const el=document.createElement("div");el.className="item"+(x.done?" done":"");
    el.innerHTML=`<button class="main tap"><span class="box">${I.check}</span><span class="t"></span></button><button class="x tap" aria-label="Ta bort">${I.close}</button>`;
    el.querySelector(".t").textContent=x.text;
    el.querySelector(".main").onclick=()=>{x.done=!x.done;buzz();renderShop();db&&db.doc("shop/"+x.id).update({done:x.done}).catch(fail)};
    el.querySelector(".x").onclick=()=>removeShop([x]);
    return el};
  $("shopTodo").replaceChildren(...(todo.length?todo.map(mk):[Object.assign(document.createElement("div"),{className:"empty",innerHTML:`${I.cart}<span>${done.length?"Allt är i korgen!":"Listan är tom"}</span>`})]));
  $("shopDone").replaceChildren(...done.map(mk));
  $("doneHead").hidden=!done.length;$("doneLbl").textContent=`I korgen (${done.length})`;
  $("shopDone").hidden=!done.length||!showDone;$("toggleDone").setAttribute("aria-expanded",showDone);
}
function removeShop(items){
  const ids=new Set(items.map(x=>x.id));shop=shop.filter(x=>!ids.has(x.id));renderShop();
  items.forEach(x=>db&&db.doc("shop/"+x.id).delete().catch(fail));
  toast(items.length>1?`${items.length} varor borttagna`:`${items[0].text} borttagen`,()=>{
    items.forEach(x=>{shop.push(x);const {id,...d}=x;db&&db.doc("shop/"+id).set(d).catch(fail)});renderShop()});
}
$("shopForm").onsubmit=e=>{e.preventDefault();const v=$("shopIn").value.trim();if(!v)return;$("shopIn").value="";buzz();
  const id=newId(),item={text:v,done:false,t:Date.now()};shop.push({id,...item});renderShop();db&&db.doc("shop/"+id).set(item).catch(fail)};
$("toggleDone").onclick=()=>{showDone=!showDone;renderShop()};
$("clearDone").onclick=()=>{const d=shop.filter(x=>x.done);if(d.length)removeShop(d)};

// ---------- money ----------
// balance > 0  =>  Kemal ligger efter Adrian
function balance(){return money.reduce((s,x)=>{const sg=x.payer==="A"?1:-1;
  return x.kind==="split"?s+sg*x.amount/2:x.kind==="settle"?s+sg*x.amount:s},0)}
let balShown=null,balAnim;
function renderBalance(){
  const b=Math.round(balance()*100)/100, el=$("bal"), amt=Math.abs(b);
  if(amt<0.01){el.className="bal even";el.innerHTML=`<div class="row">${av("A")}<span class="arrow">${I.check}</span>${av("K")}</div><div class="big">±0 kr</div><div class="sub">Ni är kvitt</div>`;balShown=0;return}
  const debtor=b>0?"K":"A", cred=OTHER[debtor];
  el.className="bal";
  el.innerHTML=`<div class="row">${av(debtor)}<span class="arrow">${I.arrow}</span>${av(cred)}</div>
    <div class="big" id="balNum" style="color:var(--${debtor.toLowerCase()})">${kr(amt)}</div>
    <div class="sub">${NAME[debtor]} ligger efter ${NAME[cred]}</div>
    <button class="btn sec tap" id="setBtn">Vi är kvitt</button>`;
  $("setBtn").onclick=()=>openSettle(debtor,cred,amt);
  const from=balShown??amt, start=performance.now();cancelAnimationFrame(balAnim);
  if(from!==amt&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    const step=t=>{const p=Math.min(1,(t-start)/450),e=1-Math.pow(1-p,3);const n=$("balNum");if(!n)return;n.textContent=kr(Math.round((from+(amt-from)*e)));if(p<1)balAnim=requestAnimationFrame(step);else n.textContent=kr(amt)};
    balAnim=requestAnimationFrame(step);
  }
  balShown=amt;
}
function openSettle(debtor,cred,amt){
  openSheet(head("Gör er kvitt")+
    `<div class="flow">${av(debtor)}${I.arrow}${av(cred)}</div>
     <p class="center"><b style="color:var(--ink);font-size:20px">${kr(amt)}</b><br>${NAME[debtor]} swishar ${NAME[cred]}</p>
     <button class="btn pri full tap" id="sYes">Klart, vi är kvitt</button>
     <button class="btn full tap" data-close>Inte än</button>`,
    el=>el.querySelector("#sYes").onclick=()=>{closeSheet();addMoney({amount:amt,payer:debtor,kind:"settle",note:"Swish"})});
}
function renderStats(){
  const paid={A:0,K:0};money.forEach(x=>{if(x.kind!=="settle")paid[x.payer]+=x.amount});
  $("stats").innerHTML=["A","K"].map(p=>`<div class="stat">${av(p,true)}<div><small>${NAME[p]} har lagt ut</small><b>${kr(paid[p])}</b></div></div>`).join("");
}
function renderHist(){
  const list=[...money].sort((a,b)=>b.t-a.t);
  $("histLbl").textContent=showAllHist?`Alla köp (${list.length})`:"Senaste köpen";
  $("toggleHist").parentElement.hidden=list.length<=4&&!showAllHist?list.length===0:false;
  $("toggleHist").setAttribute("aria-expanded",showAllHist);
  if(!list.length){$("hist").innerHTML=`<div class="empty">${I.wallet}<span>Inga köp än.<br>Tryck på <b>Nytt köp</b> för att börja.</span></div>`;return}
  $("hist").replaceChildren(...(showAllHist?list:list.slice(0,4)).map(x=>{
    const el=document.createElement("button");el.className="hrow tap";const d=new Date(x.t);
    const tag=x.kind==="treat"?'<small class="treat">BJÖD</small>':x.kind==="settle"?"<small>SWISH</small>":"<small>50/50</small>";
    const title=x.kind==="settle"?`${NAME[x.payer]} → ${NAME[OTHER[x.payer]]}`:(x.note||"Köp");
    el.innerHTML=`${av(x.payer,true)}<span class="mid"><b>${esc(title)}</b><small>${d.getDate()} ${MONTHS[d.getMonth()]}</small></span><span class="amt">${kr(x.amount)}${tag}</span>`;
    el.onclick=()=>openEntry(x);return el}));
}
$("toggleHist").onclick=()=>{showAllHist=!showAllHist;renderHist()};
function openEntry(x){
  const d=new Date(x.t);
  const kindTxt={split:"Delat 50/50",treat:`${NAME[x.payer]} bjöd`,settle:"Swish, kvitt"}[x.kind];
  const eff=x.kind==="split"?`${NAME[OTHER[x.payer]]} ska betala ${kr(x.amount/2)}`:x.kind==="treat"?"Påverkar inte saldot":`Nollade saldot`;
  openSheet(head(kr(x.amount),kindTxt)+
    `<div class="kv"><div><span>Betalade</span><b>${NAME[x.payer]}</b></div><div><span>Datum</span><b>${d.getDate()} ${MONTHS[d.getMonth()]} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</b></div>${x.note?`<div><span>Vad</span><b>${esc(x.note)}</b></div>`:""}<div><span>Saldo</span><b>${eff}</b></div></div>
     <button class="btn full tap danger" id="eDel">Ta bort</button>`,
    el=>el.querySelector("#eDel").onclick=()=>{closeSheet();
      money=money.filter(y=>y.id!==x.id);renderMoney();db&&db.doc("money/"+x.id).delete().catch(fail);
      toast(`${kr(x.amount)} borttaget`,()=>{money.push(x);renderMoney();const {id,...dd}=x;db&&db.doc("money/"+id).set(dd).catch(fail)})});
}
function renderMoney(){renderBalance();renderStats();renderHist()}
function addMoney(entry){
  const id=newId(),row={...entry,t:Date.now()};money.push({id,...row});renderMoney();db&&db.doc("money/"+id).set(row).catch(fail);
  toast(entry.kind==="settle"?"Kvitt! Saldot är nollat.":"Köpet är sparat",()=>{money=money.filter(y=>y.id!==id);renderMoney();db&&db.doc("money/"+id).delete().catch(fail)});
}
$("fab").onclick=()=>{
  let s="",payer=me,kind="split";
  openSheet(head("Nytt köp")+
    `<div class="amtview zero" id="aView">0<span>kr</span></div>
     <div class="keys">${["1","2","3","4","5","6","7","8","9",",","0","del"].map(k=>`<button class="key tap" data-k="${k}" aria-label="${k==="del"?"Radera":k}">${k==="del"?I.back:k}</button>`).join("")}</div>
     <div class="lbl">Vem betalade?</div>
     <div class="seg c2">${["A","K"].map(p=>`<button class="opt tap ${p}" data-p="${p}">${av(p,true)}${NAME[p]}</button>`).join("")}</div>
     <div class="seg c2"><button class="opt tap" data-kind="split">Dela 50/50<small>Hälften var</small></button><button class="opt tap" data-kind="treat">Bjuder<small>Ingen skuld</small></button></div>
     <button class="noteb" id="noteT">+ Lägg till vad det var</button>
     <input class="textin" id="noteIn" placeholder="T.ex. ICA, pizza" autocomplete="off" hidden>
     <p class="err" id="aErr" hidden>Skriv ett belopp först.</p>
     <button class="btn pri full tap" id="aSave">Spara</button>`,
    el=>{
      const view=el.querySelector("#aView");
      const draw=()=>{view.innerHTML=`${esc(s||"0")}<span>kr</span>`;view.classList.toggle("zero",!s)};
      const sync=()=>{el.querySelectorAll("[data-p]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p===payer));el.querySelectorAll("[data-kind]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.kind===kind))};
      el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{buzz();const k=b.dataset.k;
        if(k==="del")s=s.slice(0,-1);
        else if(k===","){if(!s.includes(","))s=(s||"0")+","}
        else{if(s.includes(",")&&s.split(",")[1].length>=2)return;if(s.replace(",","").length>=7)return;s=s==="0"?k:s+k}
        el.querySelector("#aErr").hidden=true;draw()});
      el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{payer=b.dataset.p;sync()});
      el.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{kind=b.dataset.kind;sync()});
      el.querySelector("#noteT").onclick=e=>{e.target.hidden=true;const n=el.querySelector("#noteIn");n.hidden=false;n.focus()};
      el.querySelector("#aSave").onclick=()=>{const a=parseFloat(s.replace(",","."));
        if(!(a>0)){el.querySelector("#aErr").hidden=false;return}
        closeSheet();addMoney({amount:Math.round(a*100)/100,payer,kind,note:el.querySelector("#noteIn").value.trim()})};
      sync();
    });
};

function getKey(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h){ls.set("hemma.key",h);history.replaceState(null,"",location.pathname);return h}
  return ls.get("hemma.key","");
}
function status(msg){$("status").textContent=msg||"";$("status").hidden=!msg}
async function start(){
  const key=getKey();
  if(!FIREBASE_CONFIG.projectId){status("Appen är inte kopplad till databasen än.");return}
  if(!key){status("Öppna appen via länken du fick av Adrian.");return}
  const loadTimer=setTimeout(()=>status("Det tar längre tid än vanligt att ladda. Kolla uppkopplingen."),10000);
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const fs=firebase.firestore();
    try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
    const base=fs.collection("hem").doc(key);
    db={doc:p=>{const [c,id]=p.split("/");return base.collection(c).doc(id)},collection:c=>base.collection(c)};
  }catch(e){clearTimeout(loadTimer);status("Kunde inte starta databasen.");console.error(e);return}
  let got=0;const ready=()=>{if(++got>=3){clearTimeout(loadTimer);status("")}};
  const onErr=e=>{clearTimeout(loadTimer);console.error(e);status(e.code==="permission-denied"?"Länken verkar fel. Öppna den du fick av Adrian igen.":"Kunde inte hämta data. Ladda om sidan.")};
  db.collection("meals").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());meals=m;renderWeek();ready()},onErr);
  db.collection("shop").onSnapshot(s=>{shop=s.docs.map(d=>({id:d.id,...d.data()}));renderShop();ready()},onErr);
  db.collection("money").onSnapshot(s=>{money=s.docs.map(d=>({id:d.id,...d.data()}));renderMoney();ready()},onErr);
}
